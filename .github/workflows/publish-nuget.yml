name: Publish NuGet

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: windows-latest
    environment: Production  # must match the Environment set on the nuget.org Trusted Publishing policy
    permissions:
      id-token: write  # enable GitHub OIDC token issuance for Trusted Publishing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Derive package version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore GMap.NET.sln

      - name: Pack GMap.NET.Core
        run: >
          dotnet pack GMap.NET/GMap.NET.Core/GMap.NET.Core.csproj
          --configuration Release --output ./nupkg
          -p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Pack GMap.NET.WindowsForms
        run: >
          dotnet pack GMap.NET/GMap.NET.WindowsForms/GMap.NET.WindowsForms.csproj
          --configuration Release --output ./nupkg
          -p:PackageVersion=${{ steps.version.outputs.version }}

      - name: NuGet login (OIDC -> short-lived API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }} # nuget.org profile username, not email

      - name: Push to NuGet.org
        shell: pwsh
        run: |
          Get-ChildItem -Path ./nupkg -Filter *.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName `
              --api-key ${{ steps.login.outputs.NUGET_API_KEY }} `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate
          }
